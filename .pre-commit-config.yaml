repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch=main]
  - repo: local
    hooks:
      - id: gdtest-check
        name: gdtest canonical checks
        entry: scripts/check
        language: system
        pass_filenames: false
        always_run: true
