repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(api-spec|spec)\.md$
      - id: end-of-file-fixer
        exclude: ^(api-spec|spec)\.md$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: gdtest-check
        name: gdtest canonical checks
        entry: scripts/check
        language: system
        pass_filenames: false
        always_run: true
