name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a v prefix"
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          install-only: true
      - name: Install gdkit
        run: |
          go install github.com/cafecito-games/gdkit/cmd/gdkit@v0.10.0
          gdkit_version=$(gdkit --version)
          [[ "$gdkit_version" == "gdkit version 0.10.0"* ]]
      - name: Install pinned Godot 4.7.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1
          scripts/install-godot-linux-ci "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Run canonical checks
        run: scripts/check

  package:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install pinned gpm
        run: |
          scripts/install-gpm-linux-ci "$RUNNER_TEMP/gpm-bin/gpm"
          echo "$RUNNER_TEMP/gpm-bin" >> "$GITHUB_PATH"
      - name: Install pinned Godot 4.7.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1
          scripts/install-godot-linux-ci "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          [[ -n "$version" && "$version" != *[!0-9A-Za-z.+-]* ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build and verify sliced addon
        run: |
          scripts/package-addon "${{ steps.version.outputs.value }}"
          scripts/test-package-addon "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gdtest-${{ steps.version.outputs.value }}-gpm
          path: dist/*
          if-no-files-found: error
      - name: Publish one atomic release asset set
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
